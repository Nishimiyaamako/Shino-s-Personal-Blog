# 1Panel static site (Vite SPA) Nginx snippet (single-domain)
# Usage:
# 1) Open 1Panel -> Websites -> target site -> config
# 2) Paste this inside the server {} block (keep existing SSL directives)
# 3) Keep admin entry as same-domain path: /admin/login

# Reverse proxy API requests to backend service
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Reverse proxy uploaded files from backend storage
location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 旧博客路径 → /blog 前缀（保留查询参数），301 兜底外部旧链接/书签
location ~ ^/posts(/.*)?$ { return 301 /blog$1$is_args$args; }
location ~ ^/tags(/.*)?$ { return 301 /blog/tags$1$is_args$args; }
location = /tags { return 301 /blog/tags$is_args$args; }
location = /archive { return 301 /blog/archive$is_args$args; }

# SPA fallback: avoid 404 on refresh for /blog /friends /about ... routes
location / {
    try_files $uri $uri/ /index.html;
}

# Keep index uncached for fast rollout
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Strong cache for hashed static assets
location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|webp|ico|ttf|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}
