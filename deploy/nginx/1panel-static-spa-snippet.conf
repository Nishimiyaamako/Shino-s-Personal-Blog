# 1Panel 静态站点（Vite SPA）Nginx 片段
# 用法：
# 1) 进入 1Panel -> 网站 -> 目标站点 -> 配置文件
# 2) 将下面内容放在对应 server {} 内（保留 1Panel 自动生成的 SSL 配置）

# SPA 路由回退：防止刷新 /posts /tags/... 时返回 404
location / {
    try_files $uri $uri/ /index.html;
}

# 首页不走强缓存，方便更新后立即生效
location = /index.html {
    add_header Cache-Control "no-cache";
}

# 静态资源强缓存（文件名带 hash，适合长期缓存）
location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|webp|ico|ttf|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}
