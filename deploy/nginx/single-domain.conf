# Shino's Bolg 单域名 nginx 配置模板（标准配置，替换原 1Panel 模板）
#
# 使用前替换以下占位符（不得提交真实域名/证书路径）：
#   - blog.example.com        → 真实前端域名（同时替换 http→https 跳转段）
#   - /etc/letsencrypt/live/blog.example.com/  → 真实证书路径（或改用 certbot/certonly 自动签发）
#   - /opt/shino-blog/frontend-dist  → 前端构建产物目录（默认即可，见 build-frontend-dist.sh）
#
# 安装：
#   sudo cp deploy/nginx/single-domain.conf /etc/nginx/conf.d/shino-blog.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 后端：systemd 单元 shino-blog-backend 监听 127.0.0.1:3001（见 deploy/systemd/）

# HTTP → HTTPS（保留，证书就绪后生效）
server {
    listen 80;
    server_name blog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name blog.example.com;

    # 证书占位：替换为真实路径
    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;

    root /opt/shino-blog/frontend-dist;
    index index.html;

    # API 反代 → Rust 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件反代 → Rust 后端静态服务
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧博客路径 → /blog 前缀（保留查询参数），301 兜底外部旧链接/书签
    location ~ ^/posts(/.*)?$ { return 301 /blog$1$is_args$args; }
    location ~ ^/tags(/.*)?$ { return 301 /blog/tags$1$is_args$args; }
    location = /tags { return 301 /blog/tags$is_args$args; }
    location = /archive { return 301 /blog/archive$is_args$args; }

    # SPA 回退：避免 /blog /friends /about /admin/login 等路由刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index 不缓存，便于快速发布
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带哈希静态资源强缓存
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|webp|ico|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
