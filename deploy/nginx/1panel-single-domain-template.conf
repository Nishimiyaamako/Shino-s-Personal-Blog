# Single-domain template for 1Panel static SPA + backend API
# Replace:
# - blog.example.com
# - /opt/shino-blog/frontend-dist

server {
    listen 80;
    server_name blog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.example.com;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /opt/shino-blog/frontend-dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧博客路径 → /blog 前缀（保留查询参数），301 兜底外部旧链接/书签
    location ~ ^/posts(/.*)?$ { return 301 /blog$1$is_args$args; }
    location ~ ^/tags(/.*)?$ { return 301 /blog/tags$1$is_args$args; }
    location = /tags { return 301 /blog/tags$is_args$args; }
    location = /archive { return 301 /blog/archive$is_args$args; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|webp|ico|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
