# Shino's Bolg 双域名 nginx 配置模板（标准配置，替换原 1Panel 模板）
#
# 拓扑：
#   - blog.example.com（前端域）：静态 SPA（+ 可选 /uploads/ 反代，见下方注释）
#   - api.example.com（API 域）：仅反代 /api/ 与 /uploads/ 到 Rust 后端
#
# 使用前替换占位符（不得提交真实域名/证书路径）：
#   - blog.example.com / api.example.com → 真实域名
#   - /etc/letsencrypt/live/<domain>/      → 真实证书路径
#   - /opt/shino-blog/frontend-dist       → 前端构建产物目录
#
# 前端构建时设置 VITE_API_BASE_URL=https://api.example.com（frontend/.env 生产配置），
# API 调用即走 api.example.com；前端 SPA 页面本身由 blog.example.com 静态服务。
#
# ⚠ 媒体 URL 注意：文章内容/封面中的图片 URL 是相对路径（/uploads/images/...）。
#   双域名下浏览器按前端域解析，因此前端域也必须反代 /uploads/ 才能显示图片；
#   若无法接受，保持单域名模板（single-domain.conf）。
#
# 安装：
#   sudo cp deploy/nginx/dual-domain.conf /etc/nginx/conf.d/shino-blog.conf
#   sudo nginx -t && sudo systemctl reload nginx

# ---------- 前端域：静态 SPA ----------
server {
    listen 80;
    server_name blog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.example.com;

    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;

    root /opt/shino-blog/frontend-dist;
    index index.html;

    # 旧博客路径 → /blog 前缀（保留查询参数），301 兜底外部旧链接/书签
    location ~ ^/posts(/.*)?$ { return 301 /blog$1$is_args$args; }
    location ~ ^/tags(/.*)?$ { return 301 /blog/tags$1$is_args$args; }
    location = /tags { return 301 /blog/tags$is_args$args; }
    location = /archive { return 301 /blog/archive$is_args$args; }

    # 媒体相对路径必须在前端域可达：取消注释启用 /uploads/ 反代
    # location /uploads/ {
    #     proxy_pass http://127.0.0.1:3001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA 回退：避免 /blog /friends /about /admin/login 等路由刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index 不缓存，便于快速发布
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带哈希静态资源强缓存
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|webp|ico|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

# ---------- API 域：仅反代 API 与上传 ----------
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # API 反代 → Rust 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件反代 → Rust 后端静态服务
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他路径一律 404（API 域不服务页面）
    location / {
        return 404;
    }
}
