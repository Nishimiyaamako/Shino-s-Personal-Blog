[package]
name = "shino-blog-backend"
version = "0.1.0"
edition = "2024"
description = "Shino's Bolg backend (Rust / Axum + Postgres) — API-compatible reimplementation"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = "0.4"
dotenvy = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# macros 特性仅为 sqlx::migrate!（内嵌迁移文件）启用；查询一律用运行时 query()，不引入 query! 编译期宏
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "derive", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# M2 追加：argon2 / password-hash / jsonwebtoken / pulldown-cmark / ammonia（管理 API + markdown 渲染）
argon2 = "0.5"
jsonwebtoken = "9"
pulldown-cmark = "0.13"
ammonia = "4"
uuid = { version = "1", features = ["v4"] }

# M3 追加：rusqlite（bundled 免系统依赖）— 仅 migrate-data 工具读旧 SQLite 库
# 注意：锁 0.31 而非 0.37 —— sqlx 0.8 的 migrate 特性依赖 libsqlite3-sys ^0.28，
# 0.37 需要 ^0.35，两个 libsqlite3-sys 链接同一原生库会冲突（links = "sqlite3"）
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
